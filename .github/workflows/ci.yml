name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_PATH: .tmp/wallwise-ci.sqlite

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail

          server_log=".tmp/wallwise-ci-start.log"
          health_url="http://127.0.0.1:3000/api/health"
          server_pid=""

          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill -- "-$server_pid" 2>/dev/null || kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          mkdir -p .tmp
          rm -f "$server_log"

          setsid npm start >"$server_log" 2>&1 &
          server_pid=$!

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 "$health_url" >/dev/null; then
              printf 'Production smoke check passed: %s\n' "$health_url"
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              printf 'Production server exited before %s became healthy.\n' "$health_url" >&2
              cat "$server_log" >&2
              exit 1
            fi

            sleep 1
          done

          printf 'Production server did not become ready at %s after 30 attempts.\n' "$health_url" >&2
          cat "$server_log" >&2
          exit 1

      - name: End-to-end tests
        run: npm run test:e2e
